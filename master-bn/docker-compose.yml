# =============================================================================
# docker-compose — deploy master-bn (frontend admin master data) ke VPS
#
# Prasyarat di VPS:
#   - Docker + docker compose
#   - Traefik sudah jalan dengan network external: `proxy` dan `backend`
#   - Export env DOMAIN_NAME di shell / .env (contoh: export DOMAIN_NAME=example.com)
#
# Cara pakai:
#   docker compose up -d --build
# =============================================================================

services:
  master-bn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # build-arg -> di-bake ke bundle ($env/static/public) saat `npm run build`
        PUBLIC_API_URL: ${PUBLIC_API_URL}
        PUBLIC_PORTAL_URL: ${PUBLIC_PORTAL_URL}
    image: master-bn:latest
    container_name: master-bn-app
    restart: unless-stopped
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PUBLIC_PORTAL_URL=${PUBLIC_PORTAL_URL}
      - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME}
      - PUBLIC_ALLOWED_ROLES=${PUBLIC_ALLOWED_ROLES}
    networks:
      - proxy
      - backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.master-bn.rule=Host(`master-bn.${DOMAIN_NAME}`)'
      - 'traefik.http.routers.master-bn.entrypoints=websecure'
      - 'traefik.http.routers.master-bn.tls.certresolver=myresolver'
      - 'traefik.http.services.master-bn.loadbalancer.server.port=3002'

networks:
  proxy:
    external: true
  backend:
    external: true
