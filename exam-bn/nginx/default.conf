# Reverse proxy: routes API/WebSocket traffic to the backend service and
# everything else to the SvelteKit frontend, so both are reachable through a
# single public origin (this nginx container).

upstream backend_upstream {
    server backend:3000;
}

upstream frontend_upstream {
    server frontend:5173;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # REST API — backend already serves routes under /api/v1, so the path is
    # forwarded as-is.
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Socket.IO — needs the Upgrade/Connection headers for the WebSocket
    # handshake; falls back to long-polling otherwise.
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Everything else — SvelteKit frontend (also needs Upgrade headers for
    # Vite/SvelteKit's own dev/HMR websocket if ever run behind this proxy).
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
