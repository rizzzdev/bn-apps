version: '3.8'

services:
  akademik-bn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL}
        - PUBLIC_PORTAL_URL=${PUBLIC_PORTAL_URL}
        - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME}
    container_name: akademik-bn-app
    restart: unless-stopped
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PUBLIC_PORTAL_URL=${PUBLIC_PORTAL_URL}
      - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME}
      - PUBLIC_ALLOWED_ROLES=${PUBLIC_ALLOWED_ROLES}
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.akademik-bn.rule=Host(`akademik-bn.${DOMAIN_NAME}`)"
      - "traefik.http.routers.akademik-bn.entrypoints=websecure"
      - "traefik.http.routers.akademik-bn.tls.certresolver=myresolver"
      - "traefik.http.services.akademik-bn.loadbalancer.server.port=3005"

networks:
  proxy:
    external: true
  backend:
    external: true
