<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Apps-BN - Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&amp;family=Space+Mono:wght@400;700&amp;family=Archivo+Narrow:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#570027",
                        "tertiary": "#310013",
                        "outline-variant": "#c5c6d2",
                        "on-tertiary-fixed": "#3f001a",
                        "surface-tint": "#435b9f",
                        "primary-container": "#002366",
                        "on-background": "#1b1b1b",
                        "on-primary-fixed-variant": "#2a4386",
                        "on-tertiary-fixed-variant": "#8f0044",
                        "error": "#ba1a1a",
                        "inverse-primary": "#b3c5ff",
                        "background": "#f9f9f9",
                        "surface-container": "#eeeeee",
                        "on-primary": "#ffffff",
                        "secondary": "#6a5f00",
                        "on-tertiary-container": "#ff478c",
                        "on-error-container": "#93000a",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "surface-dim": "#dadada",
                        "primary": "#00113a",
                        "on-error": "#ffffff",
                        "surface": "#f9f9f9",
                        "inverse-surface": "#303030",
                        "on-primary-container": "#758dd5",
                        "on-secondary-container": "#6e6300",
                        "on-secondary-fixed": "#201c00",
                        "on-secondary-fixed-variant": "#4f4700",
                        "on-surface-variant": "#444650",
                        "surface-container-highest": "#e2e2e2",
                        "primary-fixed-dim": "#b3c5ff",
                        "on-surface": "#1b1b1b",
                        "tertiary-fixed": "#ffd9e1",
                        "error-container": "#ffdad6",
                        "surface-bright": "#f9f9f9",
                        "surface-variant": "#e2e2e2",
                        "inverse-on-surface": "#f1f1f1",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "tertiary-fixed-dim": "#ffb1c4",
                        "on-primary-fixed": "#00174a",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed-dim": "#ddc800",
                        "secondary-fixed": "#fbe40f",
                        "outline": "#757682",
                        "surface-container-low": "#f3f3f3",
                        "secondary-container": "#f8e206"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "2xl": "1rem",
                        "3xl": "1.5rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "shadow-offset": "8px",
                        "stack-sm": "8px",
                        "border-width": "4px",
                        "margin": "32px",
                        "stack-lg": "32px",
                        "gutter": "24px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "headline-xl": ["Bricolage Grotesque"],
                        "body-lg": ["Archivo Narrow"],
                        "headline-lg": ["Bricolage Grotesque"],
                        "headline-md": ["Bricolage Grotesque"],
                        "label-bold": ["Space Mono"],
                        "label-sm": ["Space Mono"],
                        "body-md": ["Archivo Narrow"],
                        "headline-lg-mobile": ["Bricolage Grotesque"]
                    },
                    "fontSize": {
                        "headline-xl": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "500" }],
                        "headline-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "800" }],
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "1", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "1", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "headline-lg-mobile": ["36px", { "lineHeight": "1.1", "fontWeight": "800" }]
                    }
                }
            }
        }
    </script>
<style>
        .neo-shadow { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-sm { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-hover:hover { box-shadow: 2px 2px 0px 0px rgba(0,0,0,1); transform: translate(6px, 6px); }
        .neo-border { border: 4px solid #000000; }
        .neo-focus:focus-within { box-shadow: 6px 6px 0px 0px #002366; border-color: #000000; transform: translate(-2px, -2px); }
        
        .bg-pattern {
            background-image: radial-gradient(#a3a3a3 2px, transparent 2px);
            background-size: 32px 32px;
            background-position: -16px -16px;
        }
        
        .geom-shape {
            position: absolute;
            z-index: 0;
            border: 4px solid #000000;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center relative overflow-hidden bg-pattern py-12">
<!-- Dynamic Geometric Decorative Elements -->
<div class="geom-shape w-40 h-40 bg-secondary-fixed rounded-full top-8 left-8 neo-shadow hidden md:block"></div>
<div class="geom-shape w-28 h-28 bg-primary-container top-20 left-40 neo-shadow hidden lg:block transform rotate-12"></div>
<div class="geom-shape w-64 h-32 bg-on-tertiary-container rounded-3xl bottom-12 right-12 neo-shadow transform -rotate-6 hidden md:block"></div>
<div class="geom-shape w-24 h-24 bg-primary-container rounded-2xl top-1/4 right-20 neo-shadow transform rotate-45 hidden lg:block"></div>
<div class="geom-shape w-16 h-16 bg-secondary-fixed rounded-full bottom-32 left-32 neo-shadow hidden xl:block"></div>
<div class="geom-shape w-32 h-32 bg-secondary-fixed rounded-2xl -bottom-10 -left-10 neo-shadow md:hidden transform rotate-12"></div>
<div class="geom-shape w-20 h-20 bg-primary-container rounded-full -top-5 -right-5 neo-shadow md:hidden"></div>
<main class="relative z-10 w-full max-w-md px-6 md:px-0 flex flex-col items-center">
<!-- Login Card -->
<div class="relative bg-surface-container-lowest rounded-2xl neo-border neo-shadow p-8 md:p-10 flex flex-col gap-8 w-full">
<!-- Decorative Card Accents -->
<div class="absolute -top-4 -right-4 w-8 h-8 bg-secondary-fixed border-[3px] border-black rounded-full neo-shadow-sm z-20 hidden sm:block"></div>
<div class="absolute -bottom-4 -left-4 w-10 h-10 bg-primary-container border-[3px] border-black rounded-lg neo-shadow-sm z-20 transform rotate-12 hidden sm:block"></div>
<div class="absolute top-0 left-0 w-full h-2 bg-primary-container rounded-t-xl border-b-[3px] border-black"></div>
<!-- Header -->
<div class="text-center pt-2 pb-6 border-b-[3px] border-black border-dashed">
<h1 class="relative inline-block font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface uppercase tracking-tighter z-10">
<span class="absolute bottom-1 -left-2 w-[calc(100%+16px)] h-4 bg-secondary-fixed -z-10 transform -rotate-1"></span>
                    Apps-BN
                </h1>
<p class="font-label-bold text-label-bold text-on-surface-variant mt-4 tracking-widest bg-surface-container-highest inline-block px-3 py-1 border-2 border-black rounded-md">
                    IDENTIFY YOURSELF
                </p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6 mt-2" onsubmit="event.preventDefault();">
<!-- Identifier Input -->
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface uppercase flex items-center gap-2" for="identifier">
<span class="w-3 h-3 bg-secondary-fixed border-2 border-black rounded-sm inline-block"></span>
                        Identifier
                    </label>
<div class="relative rounded-xl neo-border bg-surface-container-lowest transition-all neo-focus">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">person</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-transparent border-none focus:ring-0 font-label-bold text-[15px] text-on-surface placeholder:text-outline rounded-xl" id="identifier" placeholder="Enter Username or ID" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<label class="font-headline-md text-headline-md text-on-surface uppercase flex items-center gap-2" for="password">
<span class="w-3 h-3 bg-primary-container border-2 border-black rounded-sm inline-block"></span>
                        Password
                    </label>
<div class="relative rounded-xl neo-border bg-surface-container-lowest transition-all neo-focus">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant">key</span>
<input class="w-full pl-12 pr-4 py-3.5 bg-transparent border-none focus:ring-0 font-label-bold text-[15px] text-on-surface placeholder:text-outline tracking-[0.2em] rounded-xl" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Action Button -->
<button class="mt-4 w-full bg-primary-container text-on-primary font-headline-md text-headline-md py-4.5 rounded-xl uppercase neo-border neo-shadow neo-shadow-hover transition-all duration-200 relative overflow-hidden group" type="submit">
<span class="relative z-10">Login</span>
<div class="absolute inset-0 h-full w-0 bg-on-primary-fixed-variant transition-all duration-300 ease-out group-hover:w-full z-0"></div>
</button>
<!-- Auxiliary Links -->
<div class="flex justify-between items-center mt-3 font-label-bold text-[13px]">
<a class="text-on-surface-variant hover:text-primary hover:underline decoration-2 underline-offset-4 transition-colors" href="#">Forgot Access?</a>
<a class="text-on-surface-variant hover:text-primary hover:underline decoration-2 underline-offset-4 transition-colors" href="#">Request ID</a>
</div>
</form>
</div>
<!-- Security Badge -->
<div class="mt-12 w-auto bg-secondary-fixed text-on-secondary-fixed rounded-xl neo-border px-6 py-3 flex items-center justify-center gap-3 neo-shadow transform rotate-1 hover:-rotate-1 transition-transform cursor-default">
<span class="material-symbols-outlined text-[28px]" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="font-headline-md text-[20px] uppercase tracking-tight">SECURE CONNECTION</span>
</div>
</main>
</body></html>
