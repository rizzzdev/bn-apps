<!doctype html>

<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Apps-BN - Login</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;800&amp;family=Space+Mono:wght@400;700&amp;family=Archivo+Narrow:wght@400;500&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							'tertiary-container': '#570027',
							tertiary: '#310013',
							'outline-variant': '#c5c6d2',
							'on-tertiary-fixed': '#3f001a',
							'surface-tint': '#435b9f',
							'primary-container': '#002366',
							'on-background': '#1b1b1b',
							'on-primary-fixed-variant': '#2a4386',
							'on-tertiary-fixed-variant': '#8f0044',
							error: '#ba1a1a',
							'inverse-primary': '#b3c5ff',
							background: '#f9f9f9',
							'surface-container': '#eeeeee',
							'on-primary': '#ffffff',
							secondary: '#6a5f00',
							'on-tertiary-container': '#ff478c',
							'on-error-container': '#93000a',
							'surface-container-lowest': '#ffffff',
							'primary-fixed': '#dbe1ff',
							'surface-dim': '#dadada',
							primary: '#00113a',
							'on-error': '#ffffff',
							surface: '#f9f9f9',
							'inverse-surface': '#303030',
							'on-primary-container': '#758dd5',
							'on-secondary-container': '#6e6300',
							'on-secondary-fixed': '#201c00',
							'on-secondary-fixed-variant': '#4f4700',
							'on-surface-variant': '#444650',
							'surface-container-highest': '#e2e2e2',
							'primary-fixed-dim': '#b3c5ff',
							'on-surface': '#1b1b1b',
							'tertiary-fixed': '#ffd9e1',
							'error-container': '#ffdad6',
							'surface-bright': '#f9f9f9',
							'surface-variant': '#e2e2e2',
							'inverse-on-surface': '#f1f1f1',
							'on-secondary': '#ffffff',
							'on-tertiary': '#ffffff',
							'tertiary-fixed-dim': '#ffb1c4',
							'on-primary-fixed': '#00174a',
							'surface-container-high': '#e8e8e8',
							'secondary-fixed-dim': '#ddc800',
							'secondary-fixed': '#fbe40f',
							outline: '#757682',
							'surface-container-low': '#f3f3f3',
							'secondary-container': '#f8e206'
						},
						borderRadius: {
							DEFAULT: '0.125rem',
							lg: '0.25rem',
							xl: '0.5rem',
							'2xl': '1rem',
							'3xl': '1.5rem',
							full: '9999px'
						},
						spacing: {
							'shadow-offset': '8px',
							'stack-sm': '8px',
							'border-width': '4px',
							margin: '32px',
							'stack-lg': '32px',
							gutter: '24px',
							'stack-md': '16px'
						},
						fontFamily: {
							'headline-xl': ['Bricolage Grotesque'],
							'body-lg': ['Archivo Narrow'],
							'headline-lg': ['Bricolage Grotesque'],
							'headline-md': ['Bricolage Grotesque'],
							'label-bold': ['Space Mono'],
							'label-sm': ['Space Mono'],
							'body-md': ['Archivo Narrow'],
							'headline-lg-mobile': ['Bricolage Grotesque']
						},
						fontSize: {
							'headline-xl': [
								'64px',
								{ lineHeight: '1.1', letterSpacing: '-0.04em', fontWeight: '800' }
							],
							'body-lg': ['18px', { lineHeight: '1.5', fontWeight: '500' }],
							'headline-lg': [
								'48px',
								{ lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '800' }
							],
							'headline-md': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
							'label-bold': ['14px', { lineHeight: '1', fontWeight: '700' }],
							'label-sm': ['12px', { lineHeight: '1', fontWeight: '400' }],
							'body-md': ['16px', { lineHeight: '1.5', fontWeight: '400' }],
							'headline-lg-mobile': ['36px', { lineHeight: '1.1', fontWeight: '800' }]
						}
					}
				}
			};
		</script>
		<style>
			.neo-shadow {
				box-shadow: 8px 8px 0px 0px rgba(0, 0, 0, 1);
			}
			.neo-shadow-sm {
				box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
			}
			.neo-shadow-hover:hover {
				box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
				transform: translate(6px, 6px);
			}
			.neo-border {
				border: 4px solid #000000;
			}
			.neo-focus:focus-within {
				box-shadow: 6px 6px 0px 0px #002366;
				border-color: #000000;
				transform: translate(-2px, -2px);
			}

			.bg-pattern {
				background-image: radial-gradient(#a3a3a3 2px, transparent 2px);
				background-size: 32px 32px;
				background-position: -16px -16px;
			}

			.geom-shape {
				position: absolute;
				z-index: 0;
				border: 4px solid #000000;
			}
		</style>
	</head>
	<body
		class="bg-pattern relative flex min-h-screen flex-col items-center justify-center overflow-hidden bg-background py-12"
	>
		<!-- Dynamic Geometric Decorative Elements -->
		<div
			class="geom-shape neo-shadow top-8 left-8 hidden h-40 w-40 rounded-full bg-secondary-fixed md:block"
		></div>
		<div
			class="geom-shape neo-shadow top-20 left-40 hidden h-28 w-28 rotate-12 transform bg-primary-container lg:block"
		></div>
		<div
			class="geom-shape neo-shadow right-12 bottom-12 hidden h-32 w-64 -rotate-6 transform rounded-3xl bg-on-tertiary-container md:block"
		></div>
		<div
			class="geom-shape neo-shadow top-1/4 right-20 hidden h-24 w-24 rotate-45 transform rounded-2xl bg-primary-container lg:block"
		></div>
		<div
			class="geom-shape neo-shadow bottom-32 left-32 hidden h-16 w-16 rounded-full bg-secondary-fixed xl:block"
		></div>
		<div
			class="geom-shape neo-shadow -bottom-10 -left-10 h-32 w-32 rotate-12 transform rounded-2xl bg-secondary-fixed md:hidden"
		></div>
		<div
			class="geom-shape neo-shadow -top-5 -right-5 h-20 w-20 rounded-full bg-primary-container md:hidden"
		></div>
		<main class="relative z-10 flex w-full max-w-md flex-col items-center px-6 md:px-0">
			<!-- Login Card -->
			<div
				class="neo-border neo-shadow relative flex w-full flex-col gap-8 rounded-2xl bg-surface-container-lowest p-8 md:p-10"
			>
				<!-- Decorative Card Accents -->
				<div
					class="neo-shadow-sm absolute -top-4 -right-4 z-20 hidden h-8 w-8 rounded-full border-[3px] border-black bg-secondary-fixed sm:block"
				></div>
				<div
					class="neo-shadow-sm absolute -bottom-4 -left-4 z-20 hidden h-10 w-10 rotate-12 transform rounded-lg border-[3px] border-black bg-primary-container sm:block"
				></div>
				<div
					class="absolute top-0 left-0 h-2 w-full rounded-t-xl border-b-[3px] border-black bg-primary-container"
				></div>
				<!-- Header -->
				<div class="border-b-[3px] border-dashed border-black pt-2 pb-6 text-center">
					<h1
						class="text-headline-lg-mobile md:text-headline-lg relative z-10 inline-block font-headline-lg-mobile tracking-tighter text-on-surface uppercase md:font-headline-lg"
					>
						<span
							class="absolute bottom-1 -left-2 -z-10 h-4 w-[calc(100%+16px)] -rotate-1 transform bg-secondary-fixed"
						></span>
						Apps-BN
					</h1>
					<p
						class="text-label-bold mt-4 inline-block rounded-md border-2 border-black bg-surface-container-highest px-3 py-1 font-label-bold tracking-widest text-on-surface-variant"
					>
						IDENTIFY YOURSELF
					</p>
				</div>
				<!-- Form -->
				<form class="mt-2 flex flex-col gap-6" onsubmit="event.preventDefault()">
					<!-- Identifier Input -->
					<div class="flex flex-col gap-2">
						<label
							class="text-headline-md flex items-center gap-2 font-headline-md text-on-surface uppercase"
							for="identifier"
						>
							<span
								class="inline-block h-3 w-3 rounded-sm border-2 border-black bg-secondary-fixed"
							></span>
							Identifier
						</label>
						<div
							class="neo-border neo-focus relative rounded-xl bg-surface-container-lowest transition-all"
						>
							<span
								class="material-symbols-outlined absolute top-1/2 left-4 -translate-y-1/2 text-on-surface-variant"
								>person</span
							>
							<input
								class="w-full rounded-xl border-none bg-transparent py-3.5 pr-4 pl-12 font-label-bold text-[15px] text-on-surface placeholder:text-outline focus:ring-0"
								id="identifier"
								placeholder="Enter Username or ID"
								type="text"
							/>
						</div>
					</div>
					<!-- Password Input -->
					<div class="flex flex-col gap-2">
						<label
							class="text-headline-md flex items-center gap-2 font-headline-md text-on-surface uppercase"
							for="password"
						>
							<span
								class="inline-block h-3 w-3 rounded-sm border-2 border-black bg-primary-container"
							></span>
							Password
						</label>
						<div
							class="neo-border neo-focus relative rounded-xl bg-surface-container-lowest transition-all"
						>
							<span
								class="material-symbols-outlined absolute top-1/2 left-4 -translate-y-1/2 text-on-surface-variant"
								>key</span
							>
							<input
								class="w-full rounded-xl border-none bg-transparent py-3.5 pr-4 pl-12 font-label-bold text-[15px] tracking-[0.2em] text-on-surface placeholder:text-outline focus:ring-0"
								id="password"
								placeholder="••••••••"
								type="password"
							/>
						</div>
					</div>
					<!-- Action Button -->
					<button
						class="text-headline-md neo-border neo-shadow neo-shadow-hover group relative mt-4 w-full overflow-hidden rounded-xl bg-primary-container py-4.5 font-headline-md text-on-primary uppercase transition-all duration-200"
						type="submit"
					>
						<span class="relative z-10">Login</span>
						<div
							class="absolute inset-0 z-0 h-full w-0 bg-on-primary-fixed-variant transition-all duration-300 ease-out group-hover:w-full"
						></div>
					</button>
					<!-- Auxiliary Links -->
					<div class="mt-3 flex items-center justify-between font-label-bold text-[13px]">
						<a
							class="text-on-surface-variant decoration-2 underline-offset-4 transition-colors hover:text-primary hover:underline"
							href="#"
							>Forgot Access?</a
						>
						<a
							class="text-on-surface-variant decoration-2 underline-offset-4 transition-colors hover:text-primary hover:underline"
							href="#"
							>Request ID</a
						>
					</div>
				</form>
			</div>
			<!-- Security Badge -->
			<div
				class="neo-border neo-shadow mt-12 flex w-auto rotate-1 transform cursor-default items-center justify-center gap-3 rounded-xl bg-secondary-fixed px-6 py-3 text-on-secondary-fixed transition-transform hover:-rotate-1"
			>
				<span
					class="material-symbols-outlined text-[28px]"
					style="font-variation-settings: 'FILL' 1"
					>verified_user</span
				>
				<span class="font-headline-md text-[20px] tracking-tight uppercase">SECURE CONNECTION</span>
			</div>
		</main>
	</body>
</html>
