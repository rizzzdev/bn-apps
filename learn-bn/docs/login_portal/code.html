<!doctype html>

<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Login - EduBrutal</title>
		<!-- Google Fonts -->
		<link href="https://fonts.googleapis.com" rel="preconnect" />
		<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Space+Grotesk:wght@700;900&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Material Symbols -->
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<!-- Tailwind CSS -->
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<!-- Tailwind Configuration -->
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							'on-tertiary-fixed': '#1a1c1c',
							'tertiary-fixed': '#e2e2e2',
							'outline-variant': '#c1caae',
							'inverse-primary': '#8fdb00',
							'primary-container': '#adff2f',
							secondary: '#5e5e5e',
							'on-primary-container': '#497300',
							outline: '#717a62',
							'error-container': '#ffdad6',
							'on-secondary-fixed-variant': '#474747',
							'surface-container-lowest': '#ffffff',
							background: '#f9f9f9',
							'secondary-container': '#e2e2e2',
							'primary-fixed': '#a8f928',
							'on-background': '#1a1c1c',
							'tertiary-fixed-dim': '#c6c6c7',
							'surface-dim': '#dadada',
							'surface-variant': '#e2e2e2',
							'surface-container': '#eeeeee',
							surface: '#f9f9f9',
							'on-error': '#ffffff',
							'on-primary-fixed': '#112000',
							error: '#ba1a1a',
							'surface-container-high': '#e8e8e8',
							'surface-bright': '#f9f9f9',
							'on-surface-variant': '#414a35',
							primary: '#426900',
							'inverse-surface': '#2f3131',
							'inverse-on-surface': '#f1f1f1',
							'primary-fixed-dim': '#8fdb00',
							'on-secondary-fixed': '#1b1b1b',
							'surface-tint': '#426900',
							'on-tertiary-container': '#666868',
							'on-secondary-container': '#646464',
							'tertiary-container': '#e8e8e8',
							'on-tertiary-fixed-variant': '#454747',
							'on-primary': '#ffffff',
							'on-tertiary': '#ffffff',
							'on-primary-fixed-variant': '#314f00',
							'on-surface': '#1a1c1c',
							'secondary-fixed-dim': '#c6c6c6',
							'on-secondary': '#ffffff',
							tertiary: '#5d5f5f',
							'on-error-container': '#93000a',
							'secondary-fixed': '#e2e2e2',
							'surface-container-low': '#f3f3f3',
							'surface-container-highest': '#e2e2e2'
						},
						borderRadius: {
							DEFAULT: '0.25rem',
							lg: '0.5rem',
							xl: '0.75rem',
							full: '9999px'
						},
						spacing: {
							'margin-mobile': '16px',
							'container-max': '1280px',
							base: '8px',
							'stack-lg': '48px',
							'stack-sm': '12px',
							'margin-desktop': '40px',
							gutter: '24px',
							'stack-md': '24px'
						},
						fontFamily: {
							'headline-md': ['Space Grotesk'],
							'label-bold': ['Space Grotesk'],
							'display-lg-mobile': ['Space Grotesk'],
							'display-lg': ['Space Grotesk'],
							'body-md': ['Inter'],
							'body-lg': ['Inter']
						},
						fontSize: {
							'headline-md': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
							'label-bold': ['14px', { lineHeight: '1', fontWeight: '700' }],
							'display-lg-mobile': ['32px', { lineHeight: '1.2', fontWeight: '700' }],
							'display-lg': [
								'48px',
								{ lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '700' }
							],
							'body-md': ['16px', { lineHeight: '1.5', fontWeight: '400' }],
							'body-lg': ['18px', { lineHeight: '1.6', fontWeight: '500' }]
						}
					}
				}
			};
		</script>
		<style>
			.material-symbols-outlined {
				font-variation-settings:
					'FILL' 0,
					'wght' 400,
					'GRAD' 0,
					'opsz' 24;
			}
		</style>
	</head>
	<body
		class="flex min-h-screen items-center justify-center bg-background p-margin-mobile font-body-md text-on-surface antialiased md:p-margin-desktop"
	>
		<!-- Login Container -->
		<main
			class="w-full max-w-[480px] border-2 border-on-surface bg-surface-container-lowest p-8 shadow-[8px_8px_0px_0px_rgba(26,28,28,1)] md:p-12"
		>
			<!-- Header / Logo -->
			<header class="mb-stack-md flex flex-col items-center gap-2 text-center">
				<!-- Decorative Icon -->
				<div
					class="mb-4 flex h-16 w-16 rotate-3 items-center justify-center border-2 border-on-surface bg-primary-container shadow-[4px_4px_0px_0px_rgba(26,28,28,1)]"
				>
					<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1"
						>local_fire_department</span
					>
				</div>
				<h1 class="font-display-lg text-display-lg tracking-tight text-on-surface uppercase">
					EduBrutal
				</h1>
				<p class="font-body-md text-secondary">Masuk untuk melanjutkan ke dashboard.</p>
			</header>
			<!-- Login Form -->
			<form action="#" class="flex flex-col gap-stack-md" method="POST">
				<!-- Email / Username Input -->
				<div class="relative flex flex-col gap-base">
					<label
						class="font-label-bold text-label-bold tracking-widest text-on-surface uppercase"
						for="username"
						>Email atau Username</label
					>
					<div class="relative">
						<span
							class="material-symbols-outlined absolute top-1/2 left-3 -translate-y-1/2 text-secondary"
							>person</span
						>
						<input
							class="w-full border-2 border-on-surface bg-surface-container-lowest py-3 pr-4 pl-10 font-body-md text-on-surface transition-shadow duration-100 ease-in-out placeholder:text-secondary focus:border-on-surface focus:shadow-[4px_4px_0px_0px_rgba(173,255,47,1)] focus:ring-0 focus:outline-none"
							id="username"
							name="username"
							placeholder="SiswaTeladan01"
							required=""
							type="text"
						/>
					</div>
				</div>
				<!-- Password Input -->
				<div class="relative flex flex-col gap-base">
					<label
						class="font-label-bold text-label-bold tracking-widest text-on-surface uppercase"
						for="password"
						>Kata Sandi</label
					>
					<div class="relative">
						<span
							class="material-symbols-outlined absolute top-1/2 left-3 -translate-y-1/2 text-secondary"
							>key</span
						>
						<input
							class="w-full border-2 border-on-surface bg-surface-container-lowest py-3 pr-4 pl-10 font-body-md text-on-surface transition-shadow duration-100 ease-in-out placeholder:text-secondary focus:border-on-surface focus:shadow-[4px_4px_0px_0px_rgba(173,255,47,1)] focus:ring-0 focus:outline-none"
							id="password"
							name="password"
							placeholder="••••••••"
							required=""
							type="password"
						/>
					</div>
				</div>
				<!-- Submit Button -->
				<button
					class="mt-4 flex w-full items-center justify-center gap-2 border-2 border-on-surface bg-primary-container py-4 font-label-bold text-label-bold tracking-widest text-on-surface uppercase shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] transition-all duration-100 hover:-translate-x-1 hover:-translate-y-1 hover:shadow-[8px_8px_0px_0px_rgba(26,28,28,1)] active:translate-x-1 active:translate-y-1 active:shadow-none"
					type="submit"
				>
					Masuk
					<span class="material-symbols-outlined text-lg">arrow_forward</span>
				</button>
			</form>
			<!-- Footer Links -->
			<footer
				class="mt-stack-md flex flex-col items-center justify-between gap-4 border-t-2 border-on-surface pt-stack-sm text-center sm:flex-row sm:text-left"
			>
				<a
					class="font-label-bold text-label-bold text-on-surface decoration-2 underline-offset-4 transition-colors hover:text-primary hover:underline"
					href="#"
					>Lupa Kata Sandi?</a
				>
				<span class="hidden text-secondary sm:block">|</span>
				<a
					class="font-label-bold text-label-bold text-on-surface decoration-2 underline-offset-4 transition-colors hover:text-primary hover:underline"
					href="#"
					>Daftar Sekarang</a
				>
			</footer>
		</main>
	</body>
</html>
