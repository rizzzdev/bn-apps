<!doctype html>

<html lang="id">
	<head>
		<meta charset="utf-8" />
		<meta content="width=device-width, initial-scale=1.0" name="viewport" />
		<title>Quiz Experience</title>
		<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Space+Grotesk:wght@700;900&amp;display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
			rel="stylesheet"
		/>
		<script id="tailwind-config">
			tailwind.config = {
				darkMode: 'class',
				theme: {
					extend: {
						colors: {
							'on-tertiary-fixed': '#1a1c1c',
							'tertiary-fixed': '#e2e2e2',
							'outline-variant': '#c1caae',
							'inverse-primary': '#8fdb00',
							'primary-container': '#adff2f',
							secondary: '#5e5e5e',
							'on-primary-container': '#497300',
							outline: '#717a62',
							'error-container': '#ffdad6',
							'on-secondary-fixed-variant': '#474747',
							'surface-container-lowest': '#ffffff',
							background: '#f9f9f9',
							'secondary-container': '#e2e2e2',
							'primary-fixed': '#a8f928',
							'on-background': '#1a1c1c',
							'tertiary-fixed-dim': '#c6c6c7',
							'surface-dim': '#dadada',
							'surface-variant': '#e2e2e2',
							'surface-container': '#eeeeee',
							surface: '#f9f9f9',
							'on-error': '#ffffff',
							'on-primary-fixed': '#112000',
							error: '#ba1a1a',
							'surface-container-high': '#e8e8e8',
							'surface-bright': '#f9f9f9',
							'on-surface-variant': '#414a35',
							primary: '#426900',
							'inverse-surface': '#2f3131',
							'inverse-on-surface': '#f1f1f1',
							'primary-fixed-dim': '#8fdb00',
							'on-secondary-fixed': '#1b1b1b',
							'surface-tint': '#426900',
							'on-tertiary-container': '#666868',
							'on-secondary-container': '#646464',
							'tertiary-container': '#e8e8e8',
							'on-tertiary-fixed-variant': '#454747',
							'on-primary': '#ffffff',
							'on-tertiary': '#ffffff',
							'on-primary-fixed-variant': '#314f00',
							'on-surface': '#1a1c1c',
							'secondary-fixed-dim': '#c6c6c6',
							'on-secondary': '#ffffff',
							tertiary: '#5d5f5f',
							'on-error-container': '#93000a',
							'secondary-fixed': '#e2e2e2',
							'surface-container-low': '#f3f3f3',
							'surface-container-highest': '#e2e2e2'
						},
						borderRadius: {
							DEFAULT: '0.25rem',
							lg: '0.5rem',
							xl: '0.75rem',
							full: '9999px'
						},
						spacing: {
							'margin-mobile': '16px',
							'container-max': '1280px',
							base: '8px',
							'stack-lg': '48px',
							'stack-sm': '12px',
							'margin-desktop': '40px',
							gutter: '24px',
							'stack-md': '24px'
						},
						fontFamily: {
							'headline-md': ['Space Grotesk'],
							'label-bold': ['Space Grotesk'],
							'display-lg-mobile': ['Space Grotesk'],
							'display-lg': ['Space Grotesk'],
							'body-md': ['Inter'],
							'body-lg': ['Inter']
						},
						fontSize: {
							'headline-md': ['24px', { lineHeight: '1.3', fontWeight: '700' }],
							'label-bold': ['14px', { lineHeight: '1', fontWeight: '700' }],
							'display-lg-mobile': ['32px', { lineHeight: '1.2', fontWeight: '700' }],
							'display-lg': [
								'48px',
								{ lineHeight: '1.1', letterSpacing: '-0.02em', fontWeight: '700' }
							],
							'body-md': ['16px', { lineHeight: '1.5', fontWeight: '400' }],
							'body-lg': ['18px', { lineHeight: '1.6', fontWeight: '500' }]
						}
					}
				}
			};
		</script>
		<style>
			.neo-shadow {
				box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
			}
			.neo-shadow-hover:hover {
				box-shadow: 8px 8px 0px 0px rgba(0, 0, 0, 1);
				transform: translate(-4px, -4px);
			}
			.neo-shadow-active:active {
				box-shadow: none;
				transform: translate(4px, 4px);
			}
			.neo-border {
				border: 2px solid #1a1c1c;
			}
			.neo-border-thick {
				border: 3px solid #1a1c1c;
			}

			.radio-option input[type='radio']:checked + div {
				background-color: #adff2f; /* primary-container */
				border-color: #1a1c1c;
			}
		</style>
	</head>
	<body class="flex h-screen flex-col overflow-hidden bg-surface font-body-md text-on-surface">
		<!-- Top App Bar -->
		<header
			class="sticky top-0 z-50 flex h-20 w-full flex-shrink-0 items-center justify-between border-b-2 border-on-surface bg-surface px-margin-desktop shadow-[0px_4px_0px_0px_rgba(0,0,0,1)] dark:border-outline dark:bg-on-tertiary-fixed"
		>
			<div class="flex items-center gap-4">
				<span class="material-symbols-outlined text-3xl">arrow_back</span>
				<h1 class="font-headline-md text-headline-md font-black text-on-surface">
					Math 101 - Advanced Algebra
				</h1>
			</div>
			<div class="flex items-center gap-4">
				<div
					class="flex items-center gap-2 bg-surface-container-highest px-4 py-2 font-label-bold text-label-bold neo-border"
				>
					<span class="material-symbols-outlined text-xl">timer</span>
					<span id="timer">14:59</span>
				</div>
				<button
					class="neo-shadow-active neo-shadow-hover bg-error px-6 py-3 font-label-bold text-label-bold text-on-error neo-shadow transition-all duration-100 neo-border"
				>
					Keluar
				</button>
			</div>
		</header>
		<!-- Main Content Canvas -->
		<main
			class="flex flex-grow items-start justify-center overflow-y-auto bg-background p-margin-desktop"
		>
			<div class="mt-8 flex w-full max-w-4xl max-w-container-max flex-col gap-stack-lg">
				<!-- Progress Header -->
				<div class="mb-4 flex items-end justify-between">
					<div class="font-headline-md text-headline-md">Pertanyaan 1 dari 10</div>
					<div class="font-label-bold text-label-bold text-secondary">10% Selesai</div>
				</div>
				<!-- Progress Bar -->
				<div class="neo-border-thick relative mb-8 h-6 w-full bg-surface-container-lowest">
					<div class="h-full w-[10%] border-r-2 border-on-surface bg-primary-container"></div>
				</div>
				<!-- Question Card -->
				<div
					class="flex flex-col gap-stack-md bg-surface-container-lowest p-8 neo-shadow neo-border"
				>
					<h2 class="mb-6 font-display-lg text-display-lg text-on-surface">
						Jika
						<math
							><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup
							><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>5</mn></math
						>, berapakah nilai dari <math><mi>f</mi><mo>(</mo><mn>3</mn><mo>)</mo></math
						>?
					</h2>
					<div class="flex flex-col gap-4">
						<!-- Options -->
						<label class="radio-option group cursor-pointer">
							<input class="hidden" name="quiz_q1" type="radio" value="A" />
							<div
								class="flex w-full items-center gap-4 bg-surface-container-lowest p-6 neo-shadow transition-colors neo-border group-hover:bg-surface-container-highest"
							>
								<div
									class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-on-surface bg-surface font-label-bold text-label-bold"
								>
									A
								</div>
								<span class="text-body-lg font-body-lg">1</span>
							</div>
						</label>
						<label class="radio-option group cursor-pointer">
							<input class="hidden" name="quiz_q1" type="radio" value="B" />
							<div
								class="flex w-full items-center gap-4 bg-surface-container-lowest p-6 neo-shadow transition-colors neo-border group-hover:bg-surface-container-highest"
							>
								<div
									class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-on-surface bg-surface font-label-bold text-label-bold"
								>
									B
								</div>
								<span class="text-body-lg font-body-lg">2</span>
							</div>
						</label>
						<label class="radio-option group cursor-pointer">
							<input class="hidden" name="quiz_q1" type="radio" value="C" />
							<div
								class="flex w-full items-center gap-4 bg-surface-container-lowest p-6 neo-shadow transition-colors neo-border group-hover:bg-surface-container-highest"
							>
								<div
									class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-on-surface bg-surface font-label-bold text-label-bold"
								>
									C
								</div>
								<span class="text-body-lg font-body-lg">3</span>
							</div>
						</label>
						<label class="radio-option group cursor-pointer">
							<input class="hidden" name="quiz_q1" type="radio" value="D" />
							<div
								class="flex w-full items-center gap-4 bg-surface-container-lowest p-6 neo-shadow transition-colors neo-border group-hover:bg-surface-container-highest"
							>
								<div
									class="flex h-8 w-8 items-center justify-center rounded-full border-2 border-on-surface bg-surface font-label-bold text-label-bold"
								>
									D
								</div>
								<span class="text-body-lg font-body-lg">4</span>
							</div>
						</label>
					</div>
				</div>
				<!-- Actions -->
				<div class="mt-8 flex items-center justify-between">
					<button
						class="neo-shadow-active neo-shadow-hover cursor-not-allowed bg-surface-container-lowest px-8 py-4 font-label-bold text-label-bold text-on-surface opacity-50 neo-shadow transition-all duration-100 neo-border"
						disabled=""
					>
						Pertanyaan Sebelumnya
					</button>
					<div class="flex gap-4">
						<button
							class="neo-shadow-active neo-shadow-hover bg-surface-container-highest px-8 py-4 font-label-bold text-label-bold text-on-surface neo-shadow transition-all duration-100 neo-border"
						>
							Simpan &amp; Lanjutkan Nanti
						</button>
						<button
							class="flex neo-shadow-active neo-shadow-hover items-center gap-2 bg-primary-container px-8 py-4 font-label-bold text-label-bold text-on-surface neo-shadow transition-all duration-100 neo-border"
						>
							Pertanyaan Selanjutnya
							<span class="material-symbols-outlined">arrow_forward</span>
						</button>
					</div>
				</div>
			</div>
		</main>
		<script>
			// Simple timer logic for visual effect
			let timeLeft = 14 * 60 + 59;
			const timerDisplay = document.getElementById('timer');

			setInterval(() => {
				if (timeLeft > 0) {
					timeLeft--;
					const minutes = Math.floor(timeLeft / 60);
					const seconds = timeLeft % 60;
					timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
				}
			}, 1000);
		</script>
	</body>
</html>
