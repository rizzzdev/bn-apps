<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - EduBrutal</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->

        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-tertiary-fixed": "#1a1c1c",

                        "error-container": "#ffdad6",
                        "on-secondary-fixed-variant": "#474747",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f9f9f9",
                        "secondary-container": "#e2e2e2",
                        "primary-fixed": "#a8f928",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface-dim": "#dadada",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "surface": "#f9f9f9",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#112000",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e8e8e8",
                        "surface-bright": "#f9f9f9",
                        "on-surface-variant": "#414a35",
                        "primary": "#426900",
                        "inverse-surface": "#2f3131",
                        "inverse-on-surface": "#f1f1f1",
                        "primary-fixed-dim": "#8fdb00",
                        "on-secondary-fixed": "#1b1b1b",
                        "surface-tint": "#426900",
                        "on-tertiary-container": "#666868",
                        "on-secondary-container": "#646464",
                        "tertiary-container": "#e8e8e8",
                        "on-tertiary-fixed-variant": "#454747",
                        "on-primary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-primary-fixed-variant": "#314f00",
                        "on-surface": "#1a1c1c",
                        "secondary-fixed-dim": "#c6c6c6",
                        "on-secondary": "#ffffff",
                        "tertiary": "#5d5f5f",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#e2e2e2",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-highest": "#e2e2e2"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "16px",
                        "container-max": "1280px",
                        "base": "8px",
                        "stack-lg": "48px",
                        "stack-sm": "12px",
                        "margin-desktop": "40px",
                        "gutter": "24px",
                        "stack-md": "24px"
                    },
                    "fontFamily": {
                        "headline-md": ["Space Grotesk"],
                        "label-bold": ["Space Grotesk"],
                        "display-lg-mobile": ["Space Grotesk"],
                        "display-lg": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "1.3", "fontWeight": "700" }],
                        "label-bold": ["14px", { "lineHeight": "1", "fontWeight": "700" }],
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "display-lg": ["48px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop antialiased">
<!-- Login Container -->
<main class="w-full max-w-[480px] bg-surface-container-lowest border-2 border-on-surface shadow-[8px_8px_0px_0px_rgba(26,28,28,1)] p-8 md:p-12">
<!-- Header / Logo -->
<header class="text-center mb-stack-md flex flex-col items-center gap-2">
<!-- Decorative Icon -->
<div class="w-16 h-16 bg-primary-container border-2 border-on-surface flex items-center justify-center shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] rotate-3 mb-4">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</div>
<h1 class="font-display-lg text-display-lg text-on-surface uppercase tracking-tight">EduBrutal</h1>
<p class="font-body-md text-secondary">Masuk untuk melanjutkan ke dashboard.</p>
</header>
<!-- Login Form -->
<form action="#" class="flex flex-col gap-stack-md" method="POST">
<!-- Email / Username Input -->
<div class="flex flex-col gap-base relative">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-widest" for="username">Email atau Username</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">person</span>
<input class="w-full bg-surface-container-lowest border-2 border-on-surface pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-secondary focus:outline-none focus:ring-0 focus:border-on-surface focus:shadow-[4px_4px_0px_0px_rgba(173,255,47,1)] transition-shadow duration-100 ease-in-out" id="username" name="username" placeholder="SiswaTeladan01" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-base relative">
<label class="font-label-bold text-label-bold text-on-surface uppercase tracking-widest" for="password">Kata Sandi</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-secondary">key</span>
<input class="w-full bg-surface-container-lowest border-2 border-on-surface pl-10 pr-4 py-3 font-body-md text-on-surface placeholder:text-secondary focus:outline-none focus:ring-0 focus:border-on-surface focus:shadow-[4px_4px_0px_0px_rgba(173,255,47,1)] transition-shadow duration-100 ease-in-out" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Submit Button -->
<button class="mt-4 w-full bg-primary-container text-on-surface font-label-bold text-label-bold uppercase tracking-widest py-4 border-2 border-on-surface shadow-[4px_4px_0px_0px_rgba(26,28,28,1)] hover:shadow-[8px_8px_0px_0px_rgba(26,28,28,1)] hover:-translate-y-1 hover:-translate-x-1 active:shadow-none active:translate-x-1 active:translate-y-1 transition-all duration-100 flex justify-center items-center gap-2" type="submit">
                Masuk
                <span class="material-symbols-outlined text-lg">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<footer class="mt-stack-md pt-stack-sm border-t-2 border-on-surface flex flex-col sm:flex-row justify-between items-center gap-4 text-center sm:text-left">
<a class="font-label-bold text-label-bold text-on-surface hover:text-primary transition-colors hover:underline decoration-2 underline-offset-4" href="#">Lupa Kata Sandi?</a>
<span class="hidden sm:block text-secondary">|</span>
<a class="font-label-bold text-label-bold text-on-surface hover:text-primary transition-colors hover:underline decoration-2 underline-offset-4" href="#">Daftar Sekarang</a>
</footer>
</main>
</body></html>
