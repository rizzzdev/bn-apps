<!DOCTYPE html>

<html lang="id"><head>

                        "on-background": "#1a1c1c",
                        "tertiary-fixed-dim": "#c6c6c7",
                        "surface-dim": "#dadada",
                        "surface-variant": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "surface": "#f9f9f9",
                        "on-error": "#ffffff",
                        "on-primary-fixed": "#112000",
                        "error": "#ba1a1a",
                        "surface-container-high": "#e8e8e8",

<style>
        .neo-shadow { box-shadow: 4px 4px 0px 0px rgba(0,0,0,1); }
        .neo-shadow-hover:hover { box-shadow: 8px 8px 0px 0px rgba(0,0,0,1); transform: translate(-4px, -4px); }
        .neo-shadow-active:active { box-shadow: none; transform: translate(4px, 4px); }
        .neo-border { border: 2px solid #1a1c1c; }
        .neo-border-thick { border: 3px solid #1a1c1c; }
        
        .radio-option input[type="radio"]:checked + div {
            background-color: #adff2f; /* primary-container */
            border-color: #1a1c1c;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md h-screen flex flex-col overflow-hidden">
<!-- Top App Bar -->
<header class="flex justify-between items-center w-full px-margin-desktop h-20 sticky top-0 z-50 bg-surface dark:bg-on-tertiary-fixed border-b-2 border-on-surface dark:border-outline shadow-[0px_4px_0px_0px_rgba(0,0,0,1)] flex-shrink-0">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
<h1 class="font-headline-md text-headline-md font-black text-on-surface">Math 101 - Advanced Algebra</h1>
</div>
<div class="flex items-center gap-4">
<div class="flex items-center gap-2 bg-surface-container-highest neo-border px-4 py-2 font-label-bold text-label-bold">
<span class="material-symbols-outlined text-xl">timer</span>
<span id="timer">14:59</span>
</div>
<button class="bg-error text-on-error font-label-bold text-label-bold px-6 py-3 neo-border neo-shadow neo-shadow-hover neo-shadow-active transition-all duration-100">
                Keluar
            </button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow overflow-y-auto p-margin-desktop bg-background flex justify-center items-start">
<div class="w-full max-w-4xl max-w-container-max flex flex-col gap-stack-lg mt-8">
<!-- Progress Header -->
<div class="flex justify-between items-end mb-4">
<div class="font-headline-md text-headline-md">Pertanyaan 1 dari 10</div>
<div class="font-label-bold text-label-bold text-secondary">10% Selesai</div>
</div>
<!-- Progress Bar -->
<div class="w-full h-6 bg-surface-container-lowest neo-border-thick relative mb-8">
<div class="h-full bg-primary-container w-[10%] border-r-2 border-on-surface"></div>
</div>
<!-- Question Card -->
<div class="bg-surface-container-lowest neo-border neo-shadow p-8 flex flex-col gap-stack-md">
<h2 class="font-display-lg text-display-lg text-on-surface mb-6">
                    Jika <math><mi>f</mi><mo>(</mo><mi>x</mi><mo>)</mo><mo>=</mo><msup><mi>x</mi><mn>2</mn></msup><mo>-</mo><mn>4</mn><mi>x</mi><mo>+</mo><mn>5</mn></math>, berapakah nilai dari <math><mi>f</mi><mo>(</mo><mn>3</mn><mo>)</mo></math>?
                </h2>
<div class="flex flex-col gap-4">
<!-- Options -->
<label class="radio-option cursor-pointer group">
<input class="hidden" name="quiz_q1" type="radio" value="A"/>
<div class="w-full p-6 bg-surface-container-lowest neo-border neo-shadow group-hover:bg-surface-container-highest transition-colors flex items-center gap-4">
<div class="w-8 h-8 rounded-full border-2 border-on-surface flex items-center justify-center font-label-bold text-label-bold bg-surface">A</div>
<span class="font-body-lg text-body-lg">1</span>
</div>
</label>
<label class="radio-option cursor-pointer group">
<input class="hidden" name="quiz_q1" type="radio" value="B"/>
<div class="w-full p-6 bg-surface-container-lowest neo-border neo-shadow group-hover:bg-surface-container-highest transition-colors flex items-center gap-4">
<div class="w-8 h-8 rounded-full border-2 border-on-surface flex items-center justify-center font-label-bold text-label-bold bg-surface">B</div>
<span class="font-body-lg text-body-lg">2</span>
</div>
</label>
<label class="radio-option cursor-pointer group">
<input class="hidden" name="quiz_q1" type="radio" value="C"/>
<div class="w-full p-6 bg-surface-container-lowest neo-border neo-shadow group-hover:bg-surface-container-highest transition-colors flex items-center gap-4">
<div class="w-8 h-8 rounded-full border-2 border-on-surface flex items-center justify-center font-label-bold text-label-bold bg-surface">C</div>
<span class="font-body-lg text-body-lg">3</span>
</div>
</label>
<label class="radio-option cursor-pointer group">
<input class="hidden" name="quiz_q1" type="radio" value="D"/>
<div class="w-full p-6 bg-surface-container-lowest neo-border neo-shadow group-hover:bg-surface-container-highest transition-colors flex items-center gap-4">
<div class="w-8 h-8 rounded-full border-2 border-on-surface flex items-center justify-center font-label-bold text-label-bold bg-surface">D</div>
<span class="font-body-lg text-body-lg">4</span>
</div>
</label>
</div>
</div>
<!-- Actions -->
<div class="flex justify-between items-center mt-8">
<button class="bg-surface-container-lowest text-on-surface font-label-bold text-label-bold px-8 py-4 neo-border neo-shadow neo-shadow-hover neo-shadow-active transition-all duration-100 opacity-50 cursor-not-allowed" disabled="">
                    Pertanyaan Sebelumnya
                </button>
<div class="flex gap-4">
<button class="bg-surface-container-highest text-on-surface font-label-bold text-label-bold px-8 py-4 neo-border neo-shadow neo-shadow-hover neo-shadow-active transition-all duration-100">
                        Simpan &amp; Lanjutkan Nanti
                    </button>
<button class="bg-primary-container text-on-surface font-label-bold text-label-bold px-8 py-4 neo-border neo-shadow neo-shadow-hover neo-shadow-active transition-all duration-100 flex items-center gap-2">
                        Pertanyaan Selanjutnya
                        <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
</div>
</main>
<script>
        // Simple timer logic for visual effect
        let timeLeft = 14 * 60 + 59;
        const timerDisplay = document.getElementById('timer');
        
        setInterval(() => {
            if(timeLeft > 0) {
                timeLeft--;
                const minutes = Math.floor(timeLeft / 60);
                const seconds = timeLeft % 60;
                timerDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            }
        }, 1000);
    </script>
</body></html>
