services:
  learn-bn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_URL=${PUBLIC_API_URL}
        - PUBLIC_PORTAL_URL=${PUBLIC_PORTAL_URL}
        - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME}
    container_name: learn-bn-app
    restart: unless-stopped
    environment:
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - PUBLIC_PORTAL_URL=${PUBLIC_PORTAL_URL}
      - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME}
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learn-bn.rule=Host(`learn-bn.${DOMAIN_NAME}`)"
      - "traefik.http.routers.learn-bn.entrypoints=websecure"
      - "traefik.http.routers.learn-bn.tls.certresolver=myresolver"
      - "traefik.http.services.learn-bn.loadbalancer.server.port=3006"

networks:
  proxy:
    external: true
  backend:
    external: true
