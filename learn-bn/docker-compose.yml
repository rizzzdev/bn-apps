version: '3.8'

services:
  learn-bn:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PUBLIC_API_URL=https://api-bn.${DOMAIN_NAME}
        - PUBLIC_PORTAL_URL=https://apps-bn.${DOMAIN_NAME}
        - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME:-}
    container_name: learn-bn-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - PORT=9062
      # Pass dynamic API URL or other environment variables below
      - PUBLIC_API_URL=https://api-bn.${DOMAIN_NAME}
      - PUBLIC_PORTAL_URL=https://apps-bn.${DOMAIN_NAME}
      - PUBLIC_COOKIE_DOMAIN=${DOMAIN_NAME:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9062/_app/version.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - proxy
      - backend
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.learn-bn.rule=Host(`learn-bn.${DOMAIN_NAME}`)"
      - "traefik.http.routers.learn-bn.entrypoints=websecure"
      - "traefik.http.routers.learn-bn.tls.certresolver=myresolver"
      - "traefik.http.services.learn-bn.loadbalancer.server.port=9062"

networks:
  proxy:
    external: true
  backend:
    external: true
